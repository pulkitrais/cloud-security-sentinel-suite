title: Azure AD Service Principal Credential Addition
id: 5a77f98d-8153-4b67-8812-78d1f04369e4
status: test
description: Detects the addition of secret keys, passwords, or X.509 certificates to Azure Active Directory (Entra ID) Service Principals and App Registrations, a common technique for establishing cloud persistence.
author: Pulkit Rai
date: 2026-11-24
references:
    - https://attack.mitre.org/techniques/T1098/001/
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-audit-logs
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        OperationName:
            - 'Add service principal credentials'
            - 'Update application – Certificates and secrets management '
            - 'Add service principal'
        Result: 'success'
    condition: selection
falsepositives:
    - Legitimate automated CI/CD service principal rotation via Terraform, Ansible, or GitHub Actions.
    - Scheduled administrative application credential refresh by DevOps teams.
level: high
